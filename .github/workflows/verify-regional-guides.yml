name: Verify regional guide candidate
on:
  push:
    branches: [verify-regional-guides-152]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare official destination photographs
        run: |
          python -m pip install --quiet pillow
          python scripts/collect-colca-official-images.py
          git config user.name 'Regional guide verification'
          git config user.email 'regional-guide-check@users.noreply.github.com'
          git add public/nearby colca-media.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve verified official photographs for 31 Colca destinations'
            git push origin HEAD:refs/heads/verify-regional-guides-152
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build
